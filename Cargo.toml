[workspace]
resolver = "2"
members = [
    "crates/zkml-jolt",
    "crates/zkml-tap",
    "crates/jolt-atlas-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ICME-Lab/visa-tap-zkml"
authors = ["ICME Labs <dev@icme.io>"]

[workspace.dependencies]
# Core dependencies
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Cryptographic dependencies
sha3 = "0.10"
hex = "0.4"
base64 = "0.21"
rand = "0.8"

# HTTP and networking
reqwest = { version = "0.11", features = ["json"] }
http = "1.0"
hyper = { version = "1.0", features = ["full"] }

# CLI
clap = { version = "4.4", features = ["derive", "env"] }

# Testing
proptest = "1.4"

# Internal crates
zkml-jolt = { path = "crates/zkml-jolt" }
zkml-tap = { path = "crates/zkml-tap" }
