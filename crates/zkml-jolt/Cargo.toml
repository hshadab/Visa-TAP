[package]
name = "zkml-jolt"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "JOLT-Atlas zkML proof generation and verification library"

[features]
default = ["std"]
std = []
wasm = ["wasm-bindgen", "js-sys"]
# Enable this feature when integrating real ML inference runtime
# This disables mock implementations and requires actual ONNX/TF/PyTorch integration
real-inference = []

[dependencies]
# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Cryptography
sha3 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Async runtime
tokio = { workspace = true, optional = true }

# Logging
tracing = { workspace = true }

# WASM support
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }

# Parallel processing
rayon = "1.8"

# Utilities
num_cpus = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
